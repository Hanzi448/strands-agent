[pytest]
# `.` (backend/) makes `tools`/`agents`/`lambda` importable, exactly as
# before. `..` (the repository root) additionally makes `seed` importable
# for `backend/tests/test_seed_*.py` -- `seed/` lives outside `backend/`
# (`architecture.md` -> System Boundaries) but its own tests still run
# from this one suite, in this one venv, per `code-standards.md`.
pythonpath = . ..
testpaths = tests
